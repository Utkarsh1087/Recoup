version: '3.8'

services:
  # ------------------------------------------
  # PostgreSQL Database Service
  # ------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: recoup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recoup_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recoup_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-recoup_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recoup_user} -d ${POSTGRES_DB:-recoup_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------
  # Backend API Service (FastAPI)
  # ------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: recoup-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-recoup_user}:${POSTGRES_PASSWORD:-recoup_secure_password}@postgres:5432/${POSTGRES_DB:-recoup_db}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ml:/app/ml

  # ------------------------------------------
  # Frontend Web Client (React + Nginx)
  # ------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=/api
    container_name: recoup-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
